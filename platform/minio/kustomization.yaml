apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: minio-lab
resources:
  - bootstrap
helmCharts:
  - name: minio
    repo: https://charts.min.io/
    version: 5.4.0
    releaseName: minio
    namespace: minio-lab
    valuesFile: values.yaml
    includeCRDs: true
patches:
  - target:
      kind: ServiceAccount
      name: minio-sa
    patch: |-
      - op: add
        path: /metadata/namespace
        value: minio-lab
  - target:
      kind: ConfigMap
      name: minio
    patch: |-
      - op: add
        path: /metadata/namespace
        value: minio-lab
  - target:
      kind: Service
      name: minio.*
    patch: |-
      - op: add
        path: /metadata/namespace
        value: minio-lab
  - target:
      kind: PersistentVolumeClaim
      name: minio
    patch: |-
      - op: add
        path: /metadata/namespace
        value: minio-lab
  - target:
      kind: Deployment
      name: minio
    patch: |-
      - op: add
        path: /metadata/namespace
        value: minio-lab
