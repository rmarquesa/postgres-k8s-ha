apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

helmCharts:
  - name: cluster
    repo: https://cloudnative-pg.github.io/grafana-dashboards
    version: 0.0.5
    releaseName: cnpg-dashboard
    namespace: monitoring
    valuesFile: values.yaml

resources:
  - operator-podmonitor.yaml
  - alerts.yaml
