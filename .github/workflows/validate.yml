name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.2

      - name: Install Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.18.3

      - name: Validate source files
        run: |
          python3 scripts/check_docs.py
          python3 scripts/check_site.py
          python3 -m py_compile scripts/*.py
          bash -n scripts/*.sh scripts/lib/*.sh
          git diff --check

      - name: Render Kustomize layers
        run: |
          mkdir -p /tmp/postgres-k8s-ha-renders
          kubectl kustomize platform/cert-manager --enable-helm > /tmp/postgres-k8s-ha-renders/cert-manager.yaml
          kubectl kustomize platform/cloudnative-pg --enable-helm > /tmp/postgres-k8s-ha-renders/cloudnative-pg.yaml
          kubectl kustomize platform/barman-cloud > /tmp/postgres-k8s-ha-renders/barman-cloud.yaml
          kubectl kustomize platform/sealed-secrets --enable-helm > /tmp/postgres-k8s-ha-renders/sealed-secrets.yaml
          kubectl kustomize platform/longhorn --enable-helm > /tmp/postgres-k8s-ha-renders/longhorn.yaml
          kubectl kustomize platform/minio --enable-helm > /tmp/postgres-k8s-ha-renders/minio.yaml
          kubectl kustomize databases/postgres-ha > /tmp/postgres-k8s-ha-renders/postgres-ha.yaml
          kubectl kustomize databases/postgres-ha-production > /tmp/postgres-k8s-ha-renders/postgres-ha-production.yaml
          python3 scripts/check_production.py \
            --allow-placeholders \
            /tmp/postgres-k8s-ha-renders/postgres-ha-production.yaml
          kubectl kustomize monitoring/cloudnative-pg --enable-helm > /tmp/postgres-k8s-ha-renders/cloudnative-pg-monitoring.yaml
          python3 scripts/extract_prometheus_rules.py \
            monitoring/cloudnative-pg/alerts.yaml \
            /tmp/postgres-k8s-ha-renders/prometheus-rules.yaml
          docker run --rm --entrypoint=promtool \
            -v /tmp/postgres-k8s-ha-renders/prometheus-rules.yaml:/rules.yaml:ro \
            prom/prometheus:v3.5.0 check rules /rules.yaml
          python3 scripts/check_render.py \
            /tmp/postgres-k8s-ha-renders/longhorn.yaml \
            /tmp/postgres-k8s-ha-renders/minio.yaml

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
