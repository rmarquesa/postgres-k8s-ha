apiVersion: v1
kind: Namespace
metadata:
  name: postgres-k8s-ha-test
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-smoke
  namespace: postgres-k8s-ha-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-lab
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: longhorn-smoke
  namespace: postgres-k8s-ha-test
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke
      image: busybox:1.37.0
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: longhorn-smoke
