apiVersion: batch/v1
kind: Job
metadata:
  name: minio-s3-smoke
  namespace: minio-lab
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-s3-smoke
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
          command:
            - /bin/sh
            - -ec
            - |
              mc alias set lab http://minio.minio-lab.svc.cluster.local:9000 \
                "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              marker="minio-smoke-$(date -u +%Y%m%dT%H%M%SZ)"
              printf '%s\n' "$marker" > /tmp/marker
              mc cp /tmp/marker lab/postgres-backups/smoke/marker
              mc stat lab/postgres-backups/smoke/marker
              test "$(mc cat lab/postgres-backups/smoke/marker)" = "$marker"
              mc rm lab/postgres-backups/smoke/marker
              echo "PASS: S3 put, stat, get and delete"
          env:
            - name: HOME
              value: /tmp
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: rootPassword
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
